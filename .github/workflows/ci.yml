name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: platform-independent TypeScript checks and Node contract tests.
  node-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:contracts

  # Full verification (same as `npm run verify`): needs Windows for the
  # Electron host, backend, and net10.0-windows test projects.
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - run: npm ci
      # Some spec projects are not part of Automator.sln, and the npm scripts build with --no-restore.
      - name: Restore .NET projects
        shell: pwsh
        run: Get-ChildItem -Path src, tests -Filter *.csproj -Recurse | ForEach-Object { dotnet restore $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - run: npm run verify
