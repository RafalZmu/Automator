<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__GRAPH_TITLE__</title>
<style>
:root{
  --bg:#0e1217; --panel:#161b22; --panel2:#1d242d; --line:#2a323d; --text:#e7ebf0; --muted:#8c98a7;
  --accent:#ff8f4d; --dep:#5aa9ff; --sel:#ffffff; --edge:150,165,185;
  --c-feature:#4f9cff; --c-runtime:#a78bfa; --c-shared:#2dd4bf; --c-registry:#22d3ee;
  --c-adapter:#fbbf24; --c-contract:#f472b6; --c-other:#94a3b8;
  --halo:#0e1217;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef0f3; --line:#d9dde3; --text:#1b2330; --muted:#677284;
    --accent:#e0661a; --dep:#1f6feb; --sel:#111; --edge:90,105,125;
    --c-feature:#1f6feb; --c-runtime:#7c4dff; --c-shared:#0d9488; --c-registry:#0891b2;
    --c-adapter:#d97706; --c-contract:#db2777; --c-other:#64748b; --halo:#f5f6f8;
  }
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef0f3; --line:#d9dde3; --text:#1b2330; --muted:#677284;
  --accent:#e0661a; --dep:#1f6feb; --sel:#111; --edge:90,105,125;
  --c-feature:#1f6feb; --c-runtime:#7c4dff; --c-shared:#0d9488; --c-registry:#0891b2;
  --c-adapter:#d97706; --c-contract:#db2777; --c-other:#64748b; --halo:#f5f6f8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a1006;font-weight:600}
button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:14px;margin:0;font-weight:650;white-space:nowrap}
header .sub{color:var(--muted);white-space:nowrap}
#searchwrap{position:relative;flex:1;max-width:520px}
#search{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
#results{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;z-index:20;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#results div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#results div.active,#results div:hover{background:var(--panel2)}
#results .p{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
aside#side{background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:14px}
aside h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px}
label.chk{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend{display:grid;gap:3px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--muted)}
#stage{position:relative;overflow:hidden;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
canvas.hover{cursor:pointer}
#status{position:absolute;left:12px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);pointer-events:none}
#crumb{position:absolute;left:12px;top:10px;display:none;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;display:none}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:420px;display:none;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#tip .t{font-weight:600}
#tip .s,#tip .m{color:var(--muted);font-size:12px;word-break:break-all}
#panel{position:absolute;right:0;top:0;bottom:0;width:360px;max-width:92%;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto;display:none;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#panel h2{margin:0 0 4px;font-size:15px;word-break:break-word;padding-right:26px}
#panel .close{position:absolute;right:10px;top:10px;padding:0 8px}
.badge{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);margin:0 4px 4px 0}
pre.sig{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:8px 0;white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Consolas,monospace}
.sect{margin-top:14px}
.sect h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.link{display:flex;gap:6px;align-items:baseline;padding:3px 6px;border-radius:5px;cursor:pointer}
.link:hover{background:var(--panel2)}
.link .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link .r{color:var(--muted);font-size:11px;white-space:nowrap}
.more{color:var(--muted);padding:3px 6px;font-size:12px}
a{color:var(--dep)}
.kv{color:var(--muted);font-size:12px;word-break:break-all}
.big{font-size:20px;font-weight:650}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>__GRAPH_TITLE__</h1>
    <div id="searchwrap">
      <input id="search" type="search" placeholder="Search modules, files, functions…  ( / )" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <span class="sub" id="gen"></span>
  </header>
  <aside id="side">
    <section>
      <h3>Level of detail</h3>
      <div class="row">
        <button id="b-collapse">Modules</button>
        <button id="b-files">+ Files</button>
        <button id="b-all">Everything</button>
      </div>
      <div class="small" style="margin-top:6px">Double-click a node to open or close it. Click for details and impact.</div>
    </section>
    <section>
      <h3>Links</h3>
      <label class="chk"><input type="checkbox" data-edge="call" checked><span class="sw" style="background:var(--dep)"></span>Calls</label>
      <label class="chk"><input type="checkbox" data-edge="type" checked><span class="sw" style="background:var(--c-runtime)"></span>Type references</label>
      <label class="chk"><input type="checkbox" data-edge="import" checked><span class="sw" style="background:var(--c-shared)"></span>Imports</label>
      <label class="chk"><input type="checkbox" data-edge="curated" checked><span class="sw" style="background:var(--c-adapter)"></span>Curated architecture</label>
      <label class="chk" style="margin-top:4px"><input type="checkbox" id="f-focus">Only links of the selection</label>
    </section>
    <section>
      <h3>Show</h3>
      <label class="chk"><input type="checkbox" data-lang="csharp" checked>C#</label>
      <label class="chk"><input type="checkbox" data-lang="typescript" checked>TypeScript</label>
      <label class="chk"><input type="checkbox" data-lang="tsx" checked>TSX</label>
      <label class="chk"><input type="checkbox" id="f-tests" checked>Test code</label>
      <label class="chk"><input type="checkbox" id="f-lambdas">Lambdas &amp; callbacks</label>
    </section>
    <section>
      <h3>Colour</h3>
      <div class="legend" id="legend"></div>
      <div class="small" style="margin-top:6px">Circle = module, square = file, dot = function. Dashed outline = test code. Number = hidden children.</div>
    </section>
    <section>
      <h3>View</h3>
      <div class="row">
        <button id="b-fit">Fit</button>
        <button id="b-relayout">Re-layout</button>
        <button id="b-theme">Theme</button>
      </div>
      <div class="small" style="margin-top:8px">Open in editor root</div>
      <input id="root" style="width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg)" spellcheck="false">
    </section>
  </aside>
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="crumb"></div>
    <div id="toast"></div>
    <div id="tip"></div>
    <div id="status"></div>
    <div id="panel"></div>
  </main>
</div>
<script>
'use strict';
const DATA = /*__GRAPH_DATA__*/null;
(function () {

const $ = (s) => document.querySelector(s);
const STORAGE_PREFIX = /*__STORAGE_PREFIX__*/"impactgraph.";

  get(k, d) { try { const v = localStorage.getItem(STORAGE_PREFIX + k); return v === null ? d : JSON.parse(v); } catch { return d; } },

/* ---------- static structure ---------- */
const children = Array.from({ length: NC }, () => []);

(function walk(i, d) { depth[i] = d; for (const c of children[i]) walk(c, d + 1); })(ROOT, 0);

const catOf = (kind) => ({ feature: 'feature', runtime: 'runtime', 'shared-service': 'shared', 'shared-surface': 'shared', registry: 'registry', adapter: 'adapter', contract: 'contract' }[kind] || 'other');
const CATS = [['feature', 'Feature tab'], ['runtime', 'Runtime / host'], ['shared', 'Shared service or surface'], ['registry', 'Registry'], ['adapter', 'Platform adapter'], ['contract', 'Contract'], ['other', 'Actor / data / other']];
const idIndex = new Map(N.map((n, i) => [n.id, i]));
const cat = N.map((n) => catOf(n.l === 'module' ? n.k : (N[idIndex.get(n.a)] || {}).k));

(function count(i) { let c = 0; for (const k of children[i]) c += 1 + count(k); descCount[i] = c; return c; })(ROOT);

/* ---------- state ---------- */
const S = {
  mode: 'hierarchy', expanded: new Set([ROOT]), selected: -1, hover: -1,
  center: -1, hood: 1, edgeOn: Object.assign({ call: true, type: true, import: true, curated: true, interaction: true }, store.get('edges', {})),
  lang: Object.assign({ csharp: true, typescript: true, tsx: true }, store.get('lang', {})),
  tests: store.get('tests', true), lambdas: store.get('lambdas', false),
  impact: null, root: store.get('root', DEFAULT_ROOT), capped: false, linksOnFocus: store.get('linksOnFocus', false)
};
const X = new Float64Array(NC), Y = new Float64Array(NC), VX = new Float64Array(NC), VY = new Float64Array(NC), placed = new Uint8Array(NC), pinned = new Uint8Array(NC);
let V = { nodes: [], edges: [], res: new Int32Array(NC).fill(-2), groups: [], shown: new Set() };
const cam = { k: 1, x: 0, y: 0 };

const hardHidden = (i) => { const n = N[i]; return (n.g && S.lang[n.g] === false) || (!S.tests && n.x === 1); };
const softHidden = (i) => { const n = N[i]; return n.l === 'function' && !S.lambdas && (n.k === 'lambda' || n.k === 'callback'); };

/* ---------- view construction ---------- */
function buildHierarchy() {
  const res = new Int32Array(NC).fill(-2), nodes = [], groups = [];
  const assign = (i, v) => { res[i] = v; for (const c of children[i]) assign(c, v); };
  const visit = (i) => {
    for (const c of children[i]) {
      if (hardHidden(c)) { assign(c, -2); continue; }
      if (softHidden(c)) { assign(c, i === ROOT ? -2 : i); continue; }

function buildHood() {

        if (!S.edgeOn[edgeType[k]]) continue;

        if (seen.has(o) || !ok(o)) continue;

function rebuild(reheatAmount = 0.8) {

  const { res, nodes, groups } = base;
  const map = new Map();
  for (let k = 0; k < E.length; k++) {
    if (!S.edgeOn[edgeType[k]]) continue;
    const a = res[E[k][0]], b = res[E[k][1]];
    if (a < 0 || b < 0 || a === b) continue;
    if (S.mode === 'hierarchy' && (isAncestor(a, b) || isAncestor(b, a))) continue;
    const key = a * NC + b; let e = map.get(key);
    if (!e) { e = { a, b, n: 0, types: new Set(), rels: new Map() }; map.set(key, e); }
    e.n++; e.types.add(edgeType[k]); e.rels.set(REL[E[k][2]].label, (e.rels.get(REL[E[k][2]].label) || 0) + 1);
  }
  V = { nodes, edges: [...map.values()], res, groups, shown: new Set(nodes) };
  V.adj = new Map(nodes.map((i) => [i, []]));
  for (const e of V.edges) { V.adj.get(e.a).push(e); V.adj.get(e.b).push(e); }
  V.stamp = new Map();
  V.groupDesc = new Map(groups.map((g) => [g, nodes.filter((n) => n !== g && isAncestor(g, n))]));
  buildLevels();
  if (S.selected >= 0 && !V.shown.has(S.selected)) S.selected = -1;
  placeNew();
  computeImpactView();
  status();
  reheat(reheatAmount);
  requestDraw();
}

/* ---------- layout ---------- */
function placeNew() {
  const need = V.nodes.filter((i) => !placed[i]);
  if (!need.length) return;
  const byParent = new Map();
  for (const i of need) { const p = S.mode === 'hood' ? S.center : N[i].par; if (!byParent.has(p)) byParent.set(p, []); byParent.get(p).push(i); }
  for (const [p, list] of byParent) {
    if (p === ROOT || p < 0 || !placed[p]) {
      list.sort((a, b) => cat[a].localeCompare(cat[b]));
      const R = 60 + 22 * Math.sqrt(list.length) * 3;
      list.forEach((i, k) => { const t = (k / list.length) * Math.PI * 2; X[i] = Math.cos(t) * R; Y[i] = Math.sin(t) * R; placed[i] = 1; });
    } else {
      const R = 24 + 7 * Math.sqrt(list.length);
      list.forEach((i, k) => { const t = (k / list.length) * Math.PI * 2 + Math.random() * 0.3; X[i] = X[p] + Math.cos(t) * R; Y[i] = Y[p] + Math.sin(t) * R; placed[i] = 1; });

const sim = { alpha: 0, running: false };
function reheat(a) { sim.alpha = Math.max(sim.alpha, a); if (!sim.running) { sim.running = true; requestAnimationFrame(loop); } }
function loop() {
  const steps = V.nodes.length > 900 ? 1 : 2;

    h('div', { class: 'small' }, `${imp.funcs} functions in ${imp.files.size} files across ${imp.mods.size} modules. Highlighted in orange on the map.`),
    h('div', { style: 'margin-top:6px' }, body),
    h('button', { style: 'margin-top:8px', onclick: () => { for (const f of imp.files) for (let p = N[f].par; p >= 0; p = N[p].par) S.expanded.add(p); S.mode = 'hierarchy'; rebuild(0.8); renderPanel(); } }, 'Reveal affected files'));
}

/* ---------- search ---------- */
const sIn = $('#search'), sOut = $('#results'); let sItems = [], sAct = 0;
function runSearch() {
  const q = sIn.value.trim().toLowerCase(); sOut.style.display = 'none';
  if (q.length < 2) return;
  const scored = [];
  for (let i = 0; i < NC; i++) {
    const n = N[i], t = n.t.toLowerCase(), p = (n.p || '').toLowerCase();
    let s = t === q ? 0 : t.startsWith(q) ? 1 : t.includes(q) ? 2 : p.includes(q) ? 3 : 9;
    if (s < 9) scored.push([s + (n.l === 'module' ? 0 : n.l === 'file' ? 0.1 : 0.2), i]);
  }
  scored.sort((a, b) => a[0] - b[0] || N[a[1]].t.length - N[b[1]].t.length);
  sItems = scored.slice(0, 14).map((x) => x[1]); sAct = 0;
  if (!sItems.length) return;
  sOut.replaceChildren(...sItems.map((i, k) => h('div', { class: k === 0 ? 'active' : '', onmousedown: (e) => { e.preventDefault(); chooseResult(i); } }, h('span', { class: 'sw', style: `background:${colors[cat[i]]}` }), h('b', {}, shortName(N[i])), h('span', { class: 'badge' }, N[i].l), h('span', { class: 'p' }, N[i].p || ''))));
  sOut.style.display = 'block';
}
function chooseResult(i) { sOut.style.display = 'none'; sIn.value = ''; sIn.blur(); reveal(i); }
sIn.addEventListener('input', runSearch);
sIn.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sAct = (sAct + (e.key === 'ArrowDown' ? 1 : -1) + sItems.length) % Math.max(1, sItems.length); [...sOut.children].forEach((c, k) => c.classList.toggle('active', k === sAct)); }
  else if (e.key === 'Enter' && sItems.length) chooseResult(sItems[sAct]);
  else if (e.key === 'Escape') { sOut.style.display = 'none'; sIn.blur(); }
});
sIn.addEventListener('blur', () => setTimeout(() => { sOut.style.display = 'none'; }, 120));
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/') { e.preventDefault(); sIn.focus(); }
  else if (e.key === 'Escape') { select(-1); }
  else if (e.key.toLowerCase() === 'f') fit();
});

/* ---------- sidebar ---------- */
function syncFilters() {
  document.querySelectorAll('[data-edge]').forEach((c) => { c.checked = !!S.edgeOn[c.dataset.edge]; });
  document.querySelectorAll('[data-lang]').forEach((c) => { c.checked = S.lang[c.dataset.lang] !== false; });
  $('#f-focus').checked = S.linksOnFocus; store.set('linksOnFocus', S.linksOnFocus);
  $('#f-tests').checked = S.tests; $('#f-lambdas').checked = S.lambdas;
  store.set('edges', S.edgeOn); store.set('lang', S.lang); store.set('tests', S.tests); store.set('lambdas', S.lambdas);
}
document.querySelectorAll('[data-edge]').forEach((c) => c.addEventListener('change', () => { S.edgeOn[c.dataset.edge] = c.checked; if (c.dataset.edge === 'curated') S.edgeOn.interaction = c.checked; syncFilters(); if (S.impact) computeImpact(S.impact.source); rebuild(0.3); renderPanel(); }));
document.querySelectorAll('[data-lang]').forEach((c) => c.addEventListener('change', () => { S.lang[c.dataset.lang] = c.checked; syncFilters(); rebuild(0.4); renderPanel(); }));
$('#f-focus').addEventListener('change', (e) => { S.linksOnFocus = e.target.checked; syncFilters(); requestDraw(); });
$('#f-tests').addEventListener('change', (e) => { S.tests = e.target.checked; syncFilters(); rebuild(0.4); renderPanel(); });
$('#f-lambdas').addEventListener('change', (e) => { S.lambdas = e.target.checked; syncFilters(); rebuild(0.4); renderPanel(); });
$('#b-collapse').onclick = () => { S.mode = 'hierarchy'; S.center = -1; S.expanded = new Set([ROOT]); S.impact = null; rebuild(0.8); presettle(); fit(); renderPanel(); crumb(); };
$('#b-files').onclick = () => { S.mode = 'hierarchy'; S.center = -1; S.expanded = new Set([ROOT, ...N.map((n, i) => n.l === 'module' ? i : -1).filter((i) => i >= 0)]); rebuild(1); presettle(); fit(); renderPanel(); crumb(); };
let allArm = 0;
$('#b-all').onclick = (e) => {
  if (performance.now() - allArm > 4000) { allArm = performance.now(); e.target.textContent = 'Click again (heavy)'; setTimeout(() => { e.target.textContent = 'Everything'; }, 4000); return; }
  e.target.textContent = 'Everything'; allArm = 0; S.mode = 'hierarchy'; S.center = -1; S.expanded = new Set(N.map((n, i) => children[i].length ? i : -1).filter((i) => i >= 0)); rebuild(1); presettle(); fit(); crumb();
};
$('#b-fit').onclick = fit;
$('#b-relayout').onclick = () => { placed.fill(0); pinned.fill(0); rebuild(1); presettle(); fit(); };
$('#b-theme').onclick = () => { const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#0e1217'; r.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', r.dataset.theme); readColors(); renderPanel(); requestDraw(); };
$('#root').value = S.root; $('#root').addEventListener('change', (e) => { S.root = e.target.value.trim() || DEFAULT_ROOT; store.set('root', S.root); renderPanel(); });
function status() {
  const v = V.nodes.length - (S.mode === 'hierarchy' ? V.groups.length : 0);
  $('#status').textContent = `${v} nodes · ${V.edges.length} links shown  ·  graph total ${NC.toLocaleString()} nodes / ${E.length.toLocaleString()} edges`;
}

/* ---------- boot ---------- */
if (store.get('theme', null)) document.documentElement.dataset.theme = store.get('theme', null);
$('#gen').textContent = 'built ' + new Date(DATA.generatedAt).toLocaleString();
$('#legend').replaceChildren(...CATS.map(([c, label]) => h('div', {}, h('span', { class: 'sw', style: `background:var(--c-${c})` }), label)));
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); requestDraw(); });
readColors(); resize(); syncFilters();
rebuild(1); presettle(); fit();
window.__graph = { S, N, V: () => V, select, reveal, enterHood, toggleExpand, cam: () => cam };
})();
</script>
</body>
</html>
