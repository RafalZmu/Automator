<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automator E2E Catalog</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f27; --muted: #5d6677; --line: #dde1e8;
  --accent: #2557d6; --accent-soft: #e6edfc; --idea: #8a4bd8; --idea-soft: #f1e8fc;
  --ok: #1a7f4b; --warn: #a45a00; --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --text: #e7eaf0; --muted: #9aa3b2; --line: #2e3440;
    --accent: #7ba2ff; --accent-soft: #232f4d; --idea: #c39bf5; --idea-soft: #33264a;
    --ok: #55c58a; --warn: #e0a24a; --danger: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --text: #e7eaf0; --muted: #9aa3b2; --line: #2e3440;
  --accent: #7ba2ff; --accent-soft: #232f4d; --idea: #c39bf5; --idea-soft: #33264a;
  --ok: #55c58a; --warn: #e0a24a; --danger: #ff8a80;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
button.danger { color: var(--danger); }
input, select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 18px; margin: 0; }
.stats { color: var(--muted); }
.spacer { flex: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.filters input[type=search] { flex: 1 1 260px; min-width: 0; }
.filters select { width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--panel); }
.seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#banner { display: none; margin-top: 12px; padding: 8px 12px; border-radius: 6px; background: var(--idea-soft); border: 1px solid var(--idea); align-items: center; gap: 10px; flex-wrap: wrap; }
#banner.show { display: flex; }
main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; padding: 16px 20px 40px; max-width: 1280px; margin: 0 auto; }
nav ul { list-style: none; margin: 0; padding: 0; position: sticky; top: 140px; }
nav button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; border-radius: 6px; padding: 6px 10px; }
nav button[aria-current=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .n { color: var(--muted); font-variant-numeric: tabular-nums; }
nav .n b { color: var(--idea); font-weight: 600; }
section.group { margin-bottom: 22px; }
section.group > h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
section.group > h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.card.idea { border-left: 3px solid var(--idea); }
.card summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card summary::-webkit-details-marker { display: none; }
.card summary::before { content: "›"; color: var(--muted); width: 10px; transition: transform .1s; }
.card[open] summary::before { transform: rotate(90deg); }
.title { flex: 1 1 320px; min-width: 0; }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.idea { color: var(--idea); background: var(--idea-soft); border-color: var(--idea); font-weight: 600; }
.tag.high { color: var(--danger); border-color: var(--danger); }
.tag.medium { color: var(--warn); border-color: var(--warn); }
.tag.accepted { color: var(--ok); border-color: var(--ok); }
.tag.rejected { text-decoration: line-through; }
.body { padding: 4px 14px 12px 32px; color: var(--muted); }
.body p { margin: 4px 0; }
.body ol { margin: 4px 0 6px; padding-left: 20px; }
.body code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--text); word-break: break-all; }
.actions { margin-top: 8px; display: flex; gap: 8px; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog form { padding: 18px 20px; display: grid; gap: 12px; }
dialog h3 { margin: 0; }
dialog label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
dialog .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; }
.sr { position: absolute; left: -9999px; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; padding: 12px 16px 40px; }
  nav { display: none; }
  header { padding: 12px 16px; position: static; }
  dialog .row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Automator E2E Catalog</h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <button id="copy" title="Copy all ideas as a Markdown list">Copy ideas as Markdown</button>
    <button id="add" class="primary">+ Add test idea</button>
  </div>
  <div class="filters">
    <label class="sr" for="q">Search tests</label>
    <input id="q" type="search" placeholder="Search title, steps, expected result or file…" autocomplete="off">
    <select id="category" aria-label="Category"></select>
    <select id="layer" aria-label="Test layer"></select>
    <div class="seg" role="group" aria-label="Show">
      <button data-kind="all" aria-pressed="true">All</button>
      <button data-kind="tests" aria-pressed="false">Implemented</button>
      <button data-kind="ideas" aria-pressed="false">Ideas</button>
    </div>
  </div>
  <div id="banner" role="status">
    <span id="bannerText"></span>
    <button id="save" class="primary">Save to file</button>
    <button id="discard">Discard changes</button>
  </div>
</header>
<main>
  <nav aria-label="Categories"><ul id="nav"></ul></nav>
  <div id="list" aria-live="polite"></div>
</main>

<dialog id="dialog">
  <form method="dialog" id="form">
    <h3 id="dialogTitle">Add test idea</h3>
    <label>Title <input name="title" required="" maxlength="200" placeholder="e.g. Scheduler keeps a missed run after restart"></label>
    <div class="row">
      <label>Category <select name="category"></select></label>
      <label>Layer <select name="layer"></select></label>
      <label>Priority <select name="priority"><option>Low</option><option selected="">Medium</option><option>High</option></select></label>
    </div>
    <label>Steps (one per line) <textarea name="steps" rows="4" placeholder="Open the Scheduler tab
Create a daily run and stop the app mid-run
Restart the app"></textarea></label>
    <label>Expected result <textarea name="expected" rows="2" placeholder="The missed run is flagged and can be re-run."></textarea></label>
    <label>Your name <input name="author" maxlength="80" autocomplete="name"></label>
    <div class="foot">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Save idea</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';
  // Snapshot of this file as served, before any rendering, so "Save to file" can write it back with new ideas.
  const template = '<!doctype html>\n' + document.documentElement.outerHTML;
  const data = JSON.parse(document.getElementById('e2e-data').textContent);
  const CATEGORIES = ['Launcher', 'Script Runner', 'API', 'Browser Automation', 'Workflows', 'Scheduler', 'Work Time',
    'Website Launcher', 'Codex', 'Global action search', 'Options', 'Activity and notifications',
    'Workspace window', 'Agent access (MCP)', 'Platform and shell'];
  const LAYERS = ['Electron UI', 'Contract / model', '.NET spec', 'PowerShell spec', 'Packaged app'];
  const DRAFT_KEY = 'automator-e2e-catalog-draft';

  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === false || value == null) continue;
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat()) if (child != null && child !== false) node.append(child);
    return node;
  };

  // --- unsaved ideas (survive a reload until they are written to the file) ---
  const store = {
    read() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) ?? null; } catch { return null; } },
    write(value) { try { value ? localStorage.setItem(DRAFT_KEY, JSON.stringify(value)) : localStorage.removeItem(DRAFT_KEY); } catch { /* storage unavailable */ } },
  };
  const state = { q: '', category: '', layer: '', kind: 'all', dirty: false, fileHandle: null };
  let ideas = data.ideas.map((idea) => ({ ...idea }));
  const draft = store.read();
  if (draft) {
    const byId = new Map(ideas.map((idea) => [idea.id, idea]));
    for (const idea of draft.ideas ?? []) byId.set(idea.id, idea);
    for (const id of draft.deleted ?? []) byId.delete(id);
    ideas = [...byId.values()];
    state.dirty = true;
  }
  const pending = { ideas: draft?.ideas ?? [], deleted: draft?.deleted ?? [] };
  const persistDraft = () => {
    state.dirty = pending.ideas.length > 0 || pending.deleted.length > 0;
    store.write(state.dirty ? pending : null);
  };

  const ideaItems = () => ideas.map((idea) => ({ ...idea, kind: 'idea' }));
  const testItems = () => data.tests.map((test) => ({ ...test, kind: 'test' }));
  const searchText = (item) => [item.title, item.category, item.layer, item.file, item.author, item.id,
    item.expected, ...(item.steps ?? []), item.kind === 'idea' ? 'idea' : ''].join(' ').toLowerCase();

  function visibleItems() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const pool = [...(state.kind === 'tests' ? [] : ideaItems()), ...(state.kind === 'ideas' ? [] : testItems())];
    return pool.filter((item) =>
      (!state.category || item.category === state.category) &&
      (!state.layer || item.layer === state.layer) &&
      terms.every((term) => searchText(item).includes(term)));
  }

  function renderNav() {
    const count = (category, list) => list.filter((item) => item.category === category).length;
    const all = [h('li', {}, navButton('', 'All categories', data.tests.length, ideas.length))];
    for (const category of CATEGORIES) all.push(h('li', {}, navButton(category, category, count(category, data.tests), count(category, ideas))));
    $('nav').replaceChildren(...all);
  }
  const navButton = (value, label, tests, ideaCount) => h('button', {
    'aria-current': state.category === value, onclick: () => { state.category = value; $('category').value = value; render(); },
  }, h('span', {}, label), h('span', { class: 'n' }, String(tests), ideaCount ? h('b', {}, ` +${ideaCount}`) : ''));

  function card(item) {
    const isIdea = item.kind === 'idea';
    const body = h('div', { class: 'body' });
    if (item.steps?.length) body.append(h('p', {}, 'Steps'), h('ol', {}, item.steps.map((step) => h('li', {}, step))));
    if (item.expected) body.append(h('p', {}, h('b', {}, 'Expected: '), item.expected));
    if (item.file) body.append(h('p', {}, h('code', {}, `${item.file}:${item.line}`)));
    if (isIdea) {
      body.append(h('p', {}, [item.author && `Added by ${item.author}`, item.created && `on ${item.created}`].filter(Boolean).join(' ') || 'Idea, not implemented yet.'),
        h('div', { class: 'actions' },
          h('button', { onclick: () => openDialog(item) }, 'Edit'),
          h('button', { onclick: () => item.status === 'accepted' ? setStatus(item, 'new') : setStatus(item, 'accepted') }, item.status === 'accepted' ? 'Mark as new' : 'Accept'),
          h('button', { onclick: () => setStatus(item, 'rejected') }, 'Reject'),
          h('button', { class: 'danger', onclick: () => removeIdea(item) }, 'Delete')));
    }
    return h('details', { class: 'card' + (isIdea ? ' idea' : '') },
      h('summary', {},
        h('span', { class: 'title' }, item.title),
        isIdea && h('span', { class: 'tag idea' }, 'idea'),
        isIdea && item.status && item.status !== 'new' && h('span', { class: `tag ${item.status}` }, item.status),
        isIdea && item.priority && h('span', { class: `tag ${item.priority.toLowerCase()}` }, item.priority),
        item.layer && h('span', { class: 'tag' }, item.layer)),
      body);
  }

  function render() {
    const items = visibleItems();
    const groups = Object.groupBy(items, (item) => item.category);
    const sections = CATEGORIES.filter((category) => groups[category]).map((category) => {
      const rows = groups[category];
      rows.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'idea' ? -1 : 1));
      const ideaCount = rows.filter((row) => row.kind === 'idea').length;
      return h('section', { class: 'group' },
        h('h2', {}, category, h('span', {}, `${rows.length - ideaCount} tests${ideaCount ? `, ${ideaCount} ideas` : ''}`)),
        rows.map(card));
    });
    $('list').replaceChildren(...(sections.length ? sections : [h('div', { class: 'empty' }, 'Nothing matches these filters.')]));
    $('stats').textContent = `${data.tests.length} implemented · ${ideas.length} ideas · showing ${items.length}`;
    renderNav();
    renderBanner();
    for (const button of document.querySelectorAll('.seg button')) button.setAttribute('aria-pressed', String(button.dataset.kind === state.kind));
  }

  function renderBanner() {
    $('banner').classList.toggle('show', state.dirty);
    $('bannerText').textContent = 'You have unsaved idea changes. Save them to the file, then commit it so everyone sees them.';
  }

  // --- idea edits ---
  const stamp = () => new Date().toISOString().slice(0, 10);
  const plain = ({ kind, ...idea }) => idea;
  function commitIdea(idea) {
    const record = plain(idea);
    ideas = [...ideas.filter((existing) => existing.id !== record.id), record];
    pending.ideas = [...pending.ideas.filter((existing) => existing.id !== record.id), record];
    pending.deleted = pending.deleted.filter((id) => id !== record.id);
    persistDraft();
    render();
  }
  function setStatus(item, status) { commitIdea({ ...item, status }); }
  function removeIdea(item) {
    if (!confirm(`Delete the idea "${item.title}"?`)) return;
    ideas = ideas.filter((idea) => idea.id !== item.id);
    pending.ideas = pending.ideas.filter((idea) => idea.id !== item.id);
    if (data.ideas.some((idea) => idea.id === item.id)) pending.deleted.push(item.id);
    persistDraft();
    render();
  }

  // --- dialog ---
  const form = $('form');
  let editing = null;
  function openDialog(idea = null) {
    editing = idea;
    $('dialogTitle').textContent = idea ? 'Edit test idea' : 'Add test idea';
    form.reset();
    form.title.value = idea?.title ?? '';
    form.category.value = idea?.category ?? (state.category || CATEGORIES[0]);
    form.layer.value = idea?.layer ?? '';
    form.priority.value = idea?.priority ?? 'Medium';
    form.steps.value = (idea?.steps ?? []).join('\n');
    form.expected.value = idea?.expected ?? '';
    form.author.value = idea?.author ?? lastAuthor();
    $('dialog').showModal();
    form.title.focus();
  }
  const lastAuthor = () => { try { return localStorage.getItem('automator-e2e-author') ?? ''; } catch { return ''; } };
  form.addEventListener('submit', () => {
    const value = (name) => form.elements[name].value.trim();
    if (!value('title')) return;
    try { localStorage.setItem('automator-e2e-author', value('author')); } catch { /* ignore */ }
    const id = editing?.id ?? `idea-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
    const idea = { id, title: value('title'), category: value('category'), priority: value('priority'),
      status: editing?.status ?? 'new', created: editing?.created ?? stamp() };
    if (value('layer')) idea.layer = value('layer');
    const steps = form.steps.value.split('\n').map((step) => step.replace(/^\s*(?:\d+[.)]|[-*])\s*/, '').trim()).filter(Boolean);
    if (steps.length) idea.steps = steps;
    if (value('expected')) idea.expected = value('expected');
    if (value('author')) idea.author = value('author');
    commitIdea(idea);
  });
  $('cancel').addEventListener('click', () => $('dialog').close());

  // --- saving ---
  function serialize() {
    const rows = (items) => '[\n' + items.map((item) => '  ' + JSON.stringify(item)).join(',\n') + '\n]';
    const json = `{"tests":${rows(data.tests)},\n"ideas":${rows(ideas)}}`.replace(/</g, '\\u003c');
    const pattern = /(<script type="application\/json" id="e2e-data">)[\s\S]*?(<\/script>)/;
    return template.replace(pattern, (_, open, close) => open + json + close);
  }
  async function save() {
    const html = serialize();
    try {
      if (window.showSaveFilePicker) {
        state.fileHandle ??= await window.showSaveFilePicker({ suggestedName: 'index.html', types: [{ description: 'HTML page', accept: { 'text/html': ['.html'] } }] });
        const writable = await state.fileHandle.createWritable();
        await writable.write(html);
        await writable.close();
      } else {
        const link = h('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: 'index.html' });
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
      }
    } catch (error) {
      if (error?.name !== 'AbortError') alert(`Could not save: ${error.message}`);
      return;
    }
    data.ideas = ideas.map((idea) => ({ ...idea }));
    pending.ideas = []; pending.deleted = [];
    persistDraft();
    render();
  }
  $('save').addEventListener('click', save);
  $('discard').addEventListener('click', () => {
    if (!confirm('Discard all unsaved idea changes?')) return;
    ideas = data.ideas.map((idea) => ({ ...idea }));
    pending.ideas = []; pending.deleted = [];
    persistDraft();
    render();
  });

  $('copy').addEventListener('click', async () => {
    const lines = ['# Automator E2E test ideas', ''];
    for (const category of CATEGORIES) {
      const rows = ideas.filter((idea) => idea.category === category && idea.status !== 'rejected');
      if (!rows.length) continue;
      lines.push(`## ${category}`);
      for (const idea of rows) lines.push(`- **${idea.title}** (${idea.priority ?? 'Medium'}${idea.layer ? `, ${idea.layer}` : ''})${idea.expected ? `: ${idea.expected.replace(/\s*\n\s*/g, ' ')}` : ''}`);
      lines.push('');
    }
    try { await navigator.clipboard.writeText(lines.join('\n')); $('copy').textContent = 'Copied'; }
    catch { $('copy').textContent = 'Copy failed'; }
    setTimeout(() => { $('copy').textContent = 'Copy ideas as Markdown'; }, 1500);
  });

  // --- controls ---
  const fill = (select, first, values) => select.replaceChildren(h('option', { value: '' }, first), ...values.map((value) => h('option', { value }, value)));
  fill($('category'), 'All categories', CATEGORIES);
  fill($('layer'), 'All layers', LAYERS);
  fill(form.category, '', CATEGORIES); form.category.firstElementChild.remove();
  fill(form.layer, 'Not decided', LAYERS);
  $('q').addEventListener('input', (event) => { state.q = event.target.value; render(); });
  $('category').addEventListener('change', (event) => { state.category = event.target.value; render(); });
  $('layer').addEventListener('change', (event) => { state.layer = event.target.value; render(); });
  for (const button of document.querySelectorAll('.seg button')) button.addEventListener('click', () => { state.kind = button.dataset.kind; render(); });
  $('add').addEventListener('click', () => openDialog());
  window.addEventListener('beforeunload', (event) => { if (state.dirty) { event.preventDefault(); event.returnValue = ''; } });
  render();
})();
</script></body></html>
